[project]
name = "marginbench"
version = "1.0.0"
description = "MarginBench: a falsifiable synthetic benchmark for when optimizing an operational proxy changes long-horizon business value."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "pydantic==2.11.7",
    "scikit-learn==1.6.1",
    "pyyaml==6.0.2",
    "matplotlib==3.10.3",
    "jinja2==3.1.6",
    "typer==0.16.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "hypothesis==6.135.26"]

[project.scripts]
marginbench = "marginbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running integration tests"]
